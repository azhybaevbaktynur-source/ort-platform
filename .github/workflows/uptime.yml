name: Uptime

# Free: GitHub schedule on a public repo. Checks only public URLs (no secrets). A failure opens or updates ONE issue
# titled "Uptime: site check failed"; a success closes it. GitHub may delay or skip scheduled runs under load.
# Every 10 minutes (fix round 2026-11-12 P1, PERFORMANCE_AUDIT.md 10.2 item 1): Render Free sleeps after 15 idle
# minutes, so a 10-minute ping keeps it awake unless GitHub delays or skips a run; one always-on service uses ~720 of
# Render's 750 free instance hours a month. /health never touches the database ("database": "not_checked"), so Neon
# still suspends after 5 idle minutes and its free compute hours are not spent.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_URL: https://ort-platform-w77q.onrender.com/health
      WEB_URL: https://ort-platform-nu.vercel.app/ru/login
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check API and frontend
        id: probe
        run: |
          fail=""
          # Render may be asleep or cold: one attempt can take up to 90 s; try twice.
          ok=0
          for i in 1 2; do
            if curl -fsS --max-time 90 -o /tmp/health.json "$API_URL"; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || fail="$fail API /health did not answer 200 in 90 s (two tries)."
          if [ "$ok" = 1 ] && ! grep -q '"healthy"' /tmp/health.json; then fail="$fail API /health answered but status is not healthy."; fi
          curl -fsS --max-time 30 -o /dev/null "$WEB_URL" || fail="$fail Frontend /ru/login did not answer 200 in 30 s."
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ -z "$fail" ] || echo "$fail"
      - name: Open, update or close the issue
        run: |
          title="Uptime: site check failed"
          fail="${{ steps.probe.outputs.fail }}"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$fail" ]; then
            body="$(date -u +%FT%TZ): $fail Run: $run_url"
            if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Back up at $(date -u +%FT%TZ)."
          fi
