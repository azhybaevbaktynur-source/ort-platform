name: Maintenance

# Daily database cleanup (docs/phases/DB_STORAGE_REVIEW.md 5, fix round 2026-11-12 D2; runbook docs/runbooks/MAINTENANCE.md).
# Calls POST /api/v1/internal/maintenance?dry_run=0 with the header X-Sweep-Token. The repository secret SWEEP_TOKEN must
# equal ATTEMPT_SWEEP_TOKEN on Render; without the secret the job skips with a notice instead of failing every day.
# 04:30 UTC: after Neon's Saturday 03:00-04:00 maintenance window. Secrets are not given to fork pull requests or to
# scheduled runs of forks; the token only unlocks bounded cleanup, never reads. A failure (no 200, or a task listed in
# "errors") opens or updates ONE issue titled "Maintenance: daily cleanup failed"; a success closes it.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://ort-platform-w77q.onrender.com/api/v1/internal/maintenance?dry_run=0
      SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run the cleanup
        id: run
        run: |
          if [ -z "$SWEEP_TOKEN" ]; then
            echo "::notice title=Maintenance skipped::The repository secret SWEEP_TOKEN is not set (it must equal ATTEMPT_SWEEP_TOKEN on Render). See docs/runbooks/MAINTENANCE.md."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail=""
          ok=0
          # Render may be asleep: the first call can time out while it wakes; try twice.
          for i in 1 2; do
            code=$(curl -sS --max-time 120 -o /tmp/maintenance.json -w '%{http_code}' -X POST \
              -H "X-Sweep-Token: $SWEEP_TOKEN" "$API_URL") || true
            code=${code:-000}
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "Try $i answered HTTP $code."
          done
          if [ "$ok" != 1 ]; then
            fail="The maintenance route did not answer 200 in two tries (last HTTP $code; 404 means the token is unset or differs)."
          elif ! grep -q '"errors":\[\]' /tmp/maintenance.json; then
            fail="Some tasks failed: $(grep -o '"errors":\[[^]]*\]' /tmp/maintenance.json)."
          fi
          # counts only: the answer holds no personal data
          [ -f /tmp/maintenance.json ] && [ "$ok" = 1 ] && cat /tmp/maintenance.json && echo
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ -z "$fail" ] || echo "$fail"
      - name: Open, update or close the issue
        if: steps.run.outputs.skipped != '1'
        run: |
          title="Maintenance: daily cleanup failed"
          fail="${{ steps.run.outputs.fail }}"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$fail" ]; then
            body="$(date -u +%FT%TZ): $fail Run: $run_url"
            if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Cleanup ran at $(date -u +%FT%TZ)."
          fi
