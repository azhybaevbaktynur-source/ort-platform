name: CI

on:
  push:
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests on scratch SQLite
        env:
          DATABASE_URL: sqlite:////tmp/ci/test.db
          LOCAL_UPLOAD_DIR: /tmp/ci/up
        run: |
          mkdir -p /tmp/ci/up
          python -m pytest -q -p no:cacheprovider -W ignore

  # ORT parity gate (AGENTS.md rule 9): golden imports, API e2e, score parity, seed and cutover flow
  ort-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: ORT parity tests on scratch SQLite
        env:
          DATABASE_URL: sqlite:////tmp/ci/test.db
          LOCAL_UPLOAD_DIR: /tmp/ci/up
        run: |
          mkdir -p /tmp/ci/up
          python -m pytest -q -p no:cacheprovider -W ignore tests/lms/test_ort_import_golden.py tests/lms/test_ort_e2e_api.py tests/lms/test_ort_parity.py tests/lms/test_ort_seed.py tests/lms/test_ort_cutover_flow.py

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGTZ: UTC
      PGCLIENTENCODING: UTF8
      PG_BASE: postgresql+psycopg2://postgres:postgres@localhost:5432
      LOCAL_UPLOAD_DIR: /tmp/ci/up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create databases
        run: |
          mkdir -p /tmp/ci/up
          for d in ci_migrate ci_suite ci_alembic ci_lms; do psql -d postgres -c "CREATE DATABASE $d ENCODING 'UTF8' TEMPLATE template0"; done
      - name: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/ci_migrate
        run: alembic upgrade head
      - name: alembic check (models match migrations)
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/ci_migrate
        run: alembic check
      - name: Migration tests (blocking)
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/ci_suite
          ALEMBIC_TEST_DATABASE_URL: ${{ env.PG_BASE }}/ci_alembic
          LMS_PG_TEST_DATABASE_URL: ${{ env.PG_BASE }}/ci_lms
        run: python -m pytest tests/test_migrations.py tests/lms/test_pg_concurrency.py tests/lms/test_pg_concurrency_content.py -q -p no:cacheprovider -W ignore
      - name: Phase 3 PG concurrency (attempts, grading, assessments)
        env:
          # these files also drive the app through get_db, so DATABASE_URL must be the same database
          DATABASE_URL: ${{ env.PG_BASE }}/ci_lms
          LMS_PG_TEST_DATABASE_URL: ${{ env.PG_BASE }}/ci_lms
        run: python -m pytest tests/lms/test_pg_concurrency_attempts.py tests/lms/test_grading_pg_concurrency.py tests/lms/test_assessment_pg_concurrency.py -q -p no:cacheprovider -W ignore
      - name: Old suite on Postgres
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/ci_suite
          # same database: the burst and sweep tests drive the app through get_db
          LMS_PG_TEST_DATABASE_URL: ${{ env.PG_BASE }}/ci_suite
        # Tables come from init_db()'s create_all (autouse fixture); migrations are covered above.
        run: python -m pytest -q -p no:cacheprovider -W ignore --ignore=tests/test_migrations.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build
        env:
          # All NEXT_PUBLIC_* values have in-code defaults; dummy values keep the build hermetic
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npx next build

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_i18n_parity.py

  # ORT browser e2e + screenshot baselines (PHASE_6_DESIGN section 6, docs/phases/ORT_BASELINE/README.md)
  ort-e2e:
    runs-on: ubuntu-latest
    env:
      E2E_DIR: /tmp/ort_e2e
      E2E_API_PORT: "8765"
      E2E_WEB_PORT: "3765"
      # Linux renders fonts differently from the reviewed macOS set: compare with docs/phases/ORT_BASELINE/linux/
      # when it exists, otherwise record it (artifact "ort-e2e-recorded") instead of failing
      ORT_BASELINE_RECORD_MISSING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build the frontend against the scratch backend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8765
        run: npx next build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: ORT e2e and screenshot comparison
        working-directory: frontend
        run: E2E_PYTHON="$(command -v python)" npx playwright test
      - name: Upload screenshot diffs and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ort-e2e-diffs
          path: |
            /tmp/ort_e2e/diffs
            /tmp/ort_e2e/report
            /tmp/ort_e2e/results
            /tmp/ort_e2e/backend.log
          if-no-files-found: ignore
      - name: Upload recorded baselines (platform without committed baselines)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ort-e2e-recorded
          path: /tmp/ort_e2e/recorded
          if-no-files-found: ignore
